version: '3.8'

services:
  travel-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel_ai_assistant
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=true
    volumes:
      - ./data:/app/data
    restart: unless-stopped
